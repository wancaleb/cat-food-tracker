<body>
<div class="app">
<header class="top"><img class="avatar" src="choco-avatar.png" alt="Choco"><h1 class="title">Choco飲食記錄</h1></header>
  <main id="main"></main>
  <footer class="bottom"><nav class="nav" aria-label="主選單"><button data-page="home" class="active"><b>⌂</b>今天</button><button data-page="history"><b>▤</b>歷史</button><button data-page="more"><b>⋯</b>其他</button></nav><button class="primary" id="newMeal">＋ 記一餐</button></footer>
</div>
<div class="overlay" id="editor"><div class="panel"><header class="panel-header"><button class="iconbtn" id="closeEditor" aria-label="返回">‹</button><h2>記一餐</h2></header><div class="panel-body editor-body"><section class="editor-section"><label class="label">記錄日期</label><div class="seg" id="editorDates"></div></section><section class="editor-section"><label class="label">開封中的食物 <span class="muted">· 點一下加入</span></label><div class="open-list" id="openPackages"></div><button class="subaction" id="openNewPackage">＋ 開新包</button></section><section class="editor-section meal-section"><h3 class="food-section-title">本餐食物</h3><div id="selectedFoods"></div><button class="addfood" id="chooseFood">＋ 加一種食物</button><label class="leftover-field" for="remaining"><span class="leftover-title">剩餘</span><span class="leftover-input"><input id="remaining" type="number" min="0" step="1" placeholder="0" aria-label="剩餘克數；留空視為吃完"><span>克</span></span></label></section><details class="details"><summary>餵食時間（選填）</summary><div class="field"><label class="label" for="mealTime">餵食時間</label><input id="mealTime" type="time"><p class="helper">不確定時間時留空，不會把記錄時間當作餵食時間。</p></div></details></div><div class="panel-foot"><div class="save-summary"><span id="mealSummary">0 種食物 · 0 g</span><strong id="dateSummary"></strong></div><button class="primary wide" id="saveMeal" disabled>儲存這餐</button></div></div></div>
<div class="overlay" id="search"><div class="panel"><header class="panel-header"><button class="iconbtn" id="closeSearch" aria-label="返回">‹</button><h2 id="chooserTitle">選食物</h2></header><div class="panel-body"><div class="chooser-tabs" id="chooserTabs"></div><div id="brandArea"></div><div class="result-head" id="resultLabel">最近選過的食物 · 點一下加入</div><div id="foodResults"></div><button class="optional-search" id="toggleSearch">找不到食物？用文字找</button><div class="searchbox" id="searchBox" hidden><span>⌕</span><input id="query" type="search" placeholder="搜尋品名、品牌或肉類" autocomplete="off"></div><p class="helper" id="sourceInfo">載入食物資料中…</p></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
  const dayKey = offset => { const today = new Date(); const d = new Date(today.getFullYear(),today.getMonth(),today.getDate()+offset); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const shortDate = date => `${Number(date.slice(5,7))}/${Number(date.slice(8,10))}`;
  const state = {date:dayKey(0),page:'home',tool:'menu',foods:[],packages:[],meals:[],weights:[],dataOrigin:'local',period:'7',trendStart:dayKey(-6),trendEnd:dayKey(0),trendSelectedDate:dayKey(0),weightSelectedId:'',weightPeriod:'6',weightMode:'direct',weightDraft:null,foodCategoryOpen:false,historyLimit:30};
  let database=[];
  let expandedHistoryDate='';
  let chooserMode='recent',selectedBrand='',selectedSeries='',selectedGroup='',recentIndices=[],openingPackage=false,visibleResults=30;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function readStoredValue(key){try{return localStorage.getItem(key)}catch{return null}}
  function readStoredJSON(key){try{return JSON.parse(readStoredValue(key)||'null')}catch{return null}}
  function fromLegacyMeal(m,index){const foods=(m.foods||[]).map(f=>({name:f.name||'未知食物',category:f.category||'',grams:Number(f.feedGrams??f.grams??f.servedGrams)||0,calories:Number(f.caloriesPerGram?f.caloriesPerGram*100:f.caloriesPer100g??f.calories)||0,brand:f.brand||'',meat:f.meat||''}));const total=Number(m.totalFeedGrams)||foods.reduce((n,f)=>n+f.grams,0),eaten=m.actualEatenGrams!==undefined?Number(m.actualEatenGrams):m.foods?.every(f=>f.actualGrams!==undefined)?m.foods.reduce((n,f)=>n+Number(f.actualGrams||0),0):null;return {id:m.id||`legacy-${index}-${m.date||''}-${m.time||''}`,date:String(m.date||dayKey(0)).replaceAll('/','-'),time:m.time||'',foods,remaining:eaten===null?null:Math.max(0,total-eaten),legacy:true}}
  function fromLegacyWeight(w,index){return {...w,id:w.id||`legacy-weight-${index}`,date:String(w.date||'').replaceAll('/','-'),catWeight:Number(w.catWeight)||0,note:w.note||'',timestamp:w.timestamp||''}}
  function enrichLegacyFoods(){state.meals.forEach(m=>m.foods.forEach(f=>{if(!f.category){const choices=database.filter(x=>x.name===f.name);if(choices.length){choices.sort((a,b)=>Math.abs(a.calories-Number(f.calories||0))-Math.abs(b.calories-Number(f.calories||0)));f.category=choices[0].category;f.brand=f.brand||choices[0].brand;f.calories=Number(f.calories)||choices[0].calories}}}))}
  function loadAppData(){const v2=readStoredJSON('chocoMealsV2'),legacy=readStoredJSON('catFoodHistory'),migrationDone=readStoredValue('chocoLegacyMigrated')==='1';if(Array.isArray(v2?.meals)){state.meals=v2.meals;state.meals.forEach((m,i)=>m.id=m.id||`local-${i}-${m.date}-${m.time||''}`);if(!migrationDone&&Array.isArray(legacy)){const ids=new Set(state.meals.map(m=>m.id));legacy.map(fromLegacyMeal).forEach(m=>{if(!ids.has(m.id)){state.meals.push(m);ids.add(m.id)}})}state.dataOrigin='local'}else if(Array.isArray(legacy)&&legacy.length){state.meals=legacy.map(fromLegacyMeal);state.dataOrigin='legacy'}else{state.meals=[];state.dataOrigin='local'}const savedWeights=readStoredJSON('chocoWeightsV2'),legacyWeights=readStoredJSON('catWeightHistory');state.weights=Array.isArray(savedWeights)?savedWeights:Array.isArray(legacyWeights)?legacyWeights.map(fromLegacyWeight).filter(w=>w.catWeight>0):[];state.weights.forEach((w,i)=>w.id=w.id||`weight-local-${i}-${w.date}`);if(Array.isArray(savedWeights)&&!migrationDone&&Array.isArray(legacyWeights)){const ids=new Set(state.weights.map(w=>w.id));legacyWeights.map(fromLegacyWeight).filter(w=>w.catWeight>0).forEach(w=>{if(!ids.has(w.id)){state.weights.push(w);ids.add(w.id)}})}state.deleted=readStoredJSON('chocoDeletedV2')||{meals:{},weights:{}};const savedPackages=readStoredJSON('chocoPackagesV2');if(Array.isArray(savedPackages))state.packages=savedPackages}
  function saveAppData(){try{localStorage.setItem('chocoMealsV2',JSON.stringify({version:2,meals:state.meals}));localStorage.setItem('chocoWeightsV2',JSON.stringify(state.weights));localStorage.setItem('chocoPackagesV2',JSON.stringify(state.packages.map(p=>({id:p.id,foodName:database[p.foodIndex]?.name,brand:database[p.foodIndex]?.brand,category:database[p.foodIndex]?.category,initialGrams:p.initialGrams,remainingGrams:p.remainingGrams}))));localStorage.setItem('chocoDeletedV2',JSON.stringify(state.deleted||{meals:{},weights:{}}));localStorage.setItem('chocoLegacyMigrated','1');state.dataOrigin='local'}catch(e){toast('儲存失敗，請匯出備份並確認裝置儲存空間');throw e}}
  const proteinGroups={mammal:new Set('兔肉 牛肉 羊肉 袋鼠 豬肉 鹿肉'.split(' ')),bird:new Set('火雞 火雞肉 烏骨雞 雞肉 鴕鳥 鴨肉 鴿 鵝肉 鵪鶉'.split(' ')),fish:new Set('司目魚 土魠魚 旗魚 柳葉魚 柴魚 比目魚 沙丁魚 海魚 烏魚 白帶魚 白魚 石斑 竹莢魚 紅魽 虱目魚 鬼頭刀 魩仔魚 鮪魚 鮭魚 鯖魚 鯛魚 鯡魚 鰤魚 鰹魚 鰻魚 鱈魚 鱸魚 龍虎石斑'.split(' ')),seafood:new Set('海瓜子 海膽 花枝 蝦 蟹 貝'.split(' '))};
  const groupLabels={mammal:'獸肉',bird:'禽肉',fish:'魚類',seafood:'其他海鮮',other:'其他'};
  const meatGroup=meat=>Object.entries(proteinGroups).find(([,names])=>names.has(meat))?.[0]||'other';
  const foodInGroup=(food,group)=>!group||food.meat.split(',').map(m=>meatGroup(m.trim())).includes(group);

  $('newMeal').onclick=()=>openEditor();$('closeEditor').onclick=closeEditor;$('chooseFood').onclick=()=>openChooser(false);$('openNewPackage').onclick=()=>openChooser(true);$('closeSearch').onclick=()=>$('search').classList.remove('open');$('query').oninput=()=>{visibleResults=30;renderResults()};$('toggleSearch').onclick=()=>{$('searchBox').hidden=!$('searchBox').hidden;$('toggleSearch').textContent=$('searchBox').hidden?'找不到食物？用文字找':'收起文字查找';$('query').value='';visibleResults=30;renderResults();if(!$('searchBox').hidden)$('query').focus()};
  $('saveMeal').onclick=()=>{const grams=state.foods.reduce((a,f)=>a+Number(f.grams),0),r=$('remaining').value.trim();if(r!==''&&(Number(r)<0||Number(r)>grams)){toast(`碗內剩餘需在 0～${grams} 克之間`);return}const meal={updatedAt:new Date().toISOString(),id:state.editIndex===null?`meal-${Date.now()}-${Math.random().toString(36).slice(2)}`:(state.meals[state.editIndex].id||`meal-${Date.now()}`),date:state.date,time:$('mealTime').value,foods:state.foods.map(f=>({...f,grams:Number(f.grams)})),remaining:r===''?0:Number(r)};if(state.editIndex!==null){state.meals[state.editIndex].foods.forEach(f=>{const p=state.packages.find(p=>p.id===f.packageId);if(p)p.remainingGrams+=Number(f.grams)})}meal.foods.forEach(f=>{const p=state.packages.find(p=>p.id===f.packageId);if(p)p.remainingGrams-=f.grams});if(state.editIndex===null)state.meals.unshift(meal);else state.meals[state.editIndex]=meal;saveAppData();state.page='home';closeEditor();toast(state.editIndex===null?'已加入當天餐點，可繼續記下一餐':'餐點已更新')};
  document.addEventListener('click',e=>{const control=e.target.closest('.brand-control'),options=$('brandOptions'),toggle=e.target.closest('#brandPicker'),option=e.target.closest('[data-brand-option]');if(!control){if(options){options.classList.remove('open');$('brandPicker')?.setAttribute('aria-expanded','false')}return}if(toggle){const open=options.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));return}if(option){selectedBrand=option.dataset.brandOption;selectedSeries='';selectedGroup='';visibleResults=30;renderChooser()}});
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-food-category-toggle')){state.foodCategoryOpen=!state.foodCategoryOpen;renderFoods();return}if(b.dataset.foodCategory!==undefined){state.foodCategory=b.dataset.foodCategory;state.foodCategoryOpen=false;renderFoods();return}if(b.dataset.page){state.page=b.dataset.page;if(state.page==='more')state.tool='menu';render()}if(b.dataset.historyDate!==undefined){expandedHistoryDate=expandedHistoryDate===b.dataset.historyDate?'':b.dataset.historyDate;render()}if(b.hasAttribute('data-history-more')){state.historyLimit+=30;render()}if(b.dataset.day){state.date=b.dataset.day;render()}if(b.dataset.edate){state.date=b.dataset.edate;renderEditorDates()}if(b.dataset.edit!==undefined)openEditor(Number(b.dataset.edit));if(b.dataset.delete!==undefined){const index=Number(b.dataset.delete);if(confirm('確定要刪除這筆餐點嗎？此操作無法復原。')){state.deleted.meals[state.meals[index].id]=new Date().toISOString();state.meals.splice(index,1);saveAppData();render();toast('餐點已刪除')}}if(b.dataset.remove!==undefined){state.foods.splice(Number(b.dataset.remove),1);renderSelected()}if(b.dataset.discardPack!==undefined){const id=b.dataset.discardPack;state.packages=state.packages.filter(p=>p.id!==id);state.foods.forEach(f=>{if(f.packageId===id)delete f.packageId});saveAppData();renderOpenPackages();toast('已移除開封中的包裝')}if(b.dataset.pack!==undefined){const p=state.packages.find(p=>p.id===b.dataset.pack);if(p){state.foods.push({...database[p.foodIndex],packageId:p.id,grams:''});renderSelected();focusMealGrams(document.querySelector(`[data-grams="${state.foods.length-1}"]`))}}if(b.dataset.category){chooserMode=b.dataset.category;if(selectedBrand&&!database.some(f=>f.category===chooserMode&&f.brand===selectedBrand))selectedBrand='';selectedSeries='';selectedGroup='';visibleResults=30;$('searchBox').hidden=true;$('query').value='';$('toggleSearch').textContent='找不到食物？用文字找';renderChooser()}if(b.dataset.series!==undefined){selectedSeries=b.dataset.series;selectedGroup='';visibleResults=30;renderChooser()}if(b.dataset.group!==undefined){selectedGroup=b.dataset.group;visibleResults=30;renderChooser()}if(b.id==='showMoreFoods'){visibleResults+=30;renderResults()}if(b.dataset.food!==undefined){const i=Number(b.dataset.food),f=database[i];recentIndices=[i,...recentIndices.filter(n=>n!==i)].slice(0,10);try{localStorage.setItem('chocoRecentFoods',JSON.stringify(recentIndices.map(n=>foodKey(database[n]))))}catch{}if(openingPackage){const grams=f.packageGrams||80;const p={id:`pack-${Date.now()}-${Math.random()}`,foodIndex:i,initialGrams:grams,remainingGrams:grams};state.packages.unshift(p);saveAppData();state.foods.push({...f,packageId:p.id,grams:''});renderOpenPackages();renderSelected();toast(`已開一包 ${grams}g，已加入本餐`)}else{state.foods.push({...f,grams:''});renderSelected()}$('search').classList.remove('open');focusMealGrams(document.querySelector(`[data-grams="${state.foods.length-1}"]`))}});
  document.addEventListener('input',e=>{if(e.target.id!=='weightCombined'&&e.target.id!=='weightOwner')return;const combined=Number($('weightCombined')?.value),owner=Number($('weightOwner')?.value),out=$('weightCalc');if(!out)return;out.innerHTML=combined>owner&&owner>0?`Choco 體重　<strong>${(combined-owner).toFixed(2)} kg</strong>`:'輸入以上兩個重量，就會自動計算 Choco 體重。'});
  document.addEventListener('click',async e=>{const weightPoint=e.target.closest('[data-weight-point]');if(weightPoint){state.weightSelectedId=weightPoint.dataset.weightPoint;render();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.tool!==undefined){state.tool=b.dataset.tool;render();return}if(b.dataset.period){state.period=b.dataset.period;if(state.period==='custom'){state.trendStart=state.trendStart||dayKey(-6);state.trendEnd=state.trendEnd||dayKey(0)}render();return}if(b.dataset.trendDate){state.trendSelectedDate=b.dataset.trendDate;render();return}if(b.hasAttribute('data-trend-apply')){const start=$('trendStart').value,end=$('trendEnd').value;if(!start||!end||start>end){toast('請確認開始與結束日期');return}const count=Math.round((new Date(`${end}T00:00:00`)-new Date(`${start}T00:00:00`))/86400000)+1;if(count>730){toast('自訂區間最多選兩年');return}state.trendStart=start;state.trendEnd=end;state.trendSelectedDate=end;render();return}if(b.hasAttribute('data-export')){exportData();return}if(b.hasAttribute('data-import')){$('importFile').click();return}if(b.hasAttribute('data-load-legacy')){const oldMeals=readStoredJSON('catFoodHistory'),oldWeights=readStoredJSON('catWeightHistory');if(!Array.isArray(oldMeals)&&!Array.isArray(oldWeights)){toast('此瀏覽器找不到舊版本機紀錄');return}importParsedData({data:{mealHistory:Array.isArray(oldMeals)?oldMeals:[],weightHistory:Array.isArray(oldWeights)?oldWeights:[]}});return}if(b.hasAttribute('data-gist-load')){await loadGist();return}if(b.hasAttribute('data-gist-save')){await saveGist();return}if(b.dataset.weightEdit){state.weightDraft=state.weights.find(w=>w.id===b.dataset.weightEdit)||null;state.weightMode=state.weightDraft?.method||(state.weightDraft?.catOwnerWeight?'hold':'direct');render();return}if(b.dataset.weightMode){state.weightMode=b.dataset.weightMode;render();return}if(b.dataset.weightPeriod){state.weightPeriod=b.dataset.weightPeriod;state.weightSelectedId='';render();return}if(b.hasAttribute('data-weight-cancel')){state.weightDraft=null;state.weightMode='direct';render();return}if(b.hasAttribute('data-weight-save')){const method=state.weightMode,date=$('weightDate').value,note=$('weightNote').value.trim();let catWeight,catOwnerWeight=null,ownerWeight=null;if(method==='hold'){catOwnerWeight=Number($('weightCombined').value);ownerWeight=Number($('weightOwner').value);catWeight=Math.round((catOwnerWeight-ownerWeight)*100)/100;if(!(catOwnerWeight>ownerWeight&&ownerWeight>0)){toast('請確認合計體重比自己的體重大，且數值有效');return}}else{catWeight=Number($('weightValue').value);if(!(catWeight>0&&catWeight<30)){toast('請輸入有效的 Choco 體重');return}}if(!date){toast('請選擇測量日期');return}const entry={updatedAt:new Date().toISOString(),id:state.weightDraft?.id||`weight-${Date.now()}-${Math.random().toString(36).slice(2)}`,method,catWeight,catOwnerWeight,ownerWeight,date,note,timestamp:new Date().toISOString()};if(state.weightDraft){const i=state.weights.findIndex(w=>w.id===state.weightDraft.id);if(i>=0)state.weights[i]=entry}else state.weights.push(entry);state.weights.sort((a,b)=>String(b.date).localeCompare(String(a.date)));state.weightSelectedId=entry.id;state.weightDraft=null;state.weightMode='direct';saveAppData();render();toast(`已記錄 Choco ${catWeight.toFixed(2)} kg`);return}if(b.dataset.weightDelete){if(confirm('確定刪除這筆體重紀錄？')){state.deleted.weights[b.dataset.weightDelete]=new Date().toISOString();state.weights=state.weights.filter(w=>w.id!==b.dataset.weightDelete);saveAppData();render();toast('體重紀錄已刪除')}}});
  document.addEventListener('click',e=>{if(state.foodCategoryOpen&&!e.target.closest('.food-category-select')){state.foodCategoryOpen=false;if(state.page==='more'&&state.tool==='foods')renderFoods()}});
  document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files?.[0]){try{const parsed=JSON.parse(await e.target.files[0].text());importParsedData(parsed)}catch(err){toast(`匯入失敗：${err.message}`)}e.target.value=''}});
  document.addEventListener('input',e=>{if(e.target.dataset.grams!==undefined){state.foods[Number(e.target.dataset.grams)].grams=e.target.value;updateMealSummary()}if(e.target.id==='editorDate'){state.date=e.target.value;updateMealSummary()}});
  document.addEventListener('change',e=>{if(e.target.id==='homeDate'){state.date=e.target.value;render()}});
  let lastCalendarDay=dayKey(0);
  function refreshCalendarDay(){const now=dayKey(0);if(now===lastCalendarDay)return;if(!$('editor').classList.contains('open')&&state.date===lastCalendarDay)state.date=now;lastCalendarDay=now;if(!$('editor').classList.contains('open'))render()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCalendarDay()});window.addEventListener('focus',refreshCalendarDay);setInterval(refreshCalendarDay,60000);
  loadAppData();render();loadFoods().then(()=>{enrichLegacyFoods();render()});
