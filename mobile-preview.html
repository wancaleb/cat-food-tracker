<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>貓貓飲食・手機版預覽</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#283044;background:#e8ebf7;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #856cff;outline-offset:2px}
    .app{width:min(100%,430px);min-height:100dvh;margin:auto;background:#f7f7fb;position:relative;box-shadow:0 16px 60px #3333;padding-bottom:calc(94px + env(safe-area-inset-bottom))}
    .top{padding:calc(22px + env(safe-area-inset-top)) 22px 18px;background:#fff;border-bottom:1px solid #eeeefa;display:flex;align-items:center;gap:11px}
    .avatar{width:42px;height:42px;border-radius:14px;object-fit:cover;object-position:center 40%;background:#e5ddff}
    .eyebrow{font-size:12px;color:#777f94;font-weight:700;letter-spacing:.08em}.title{margin:2px 0 0;font-size:20px;line-height:1.2}.preview-badge{margin-left:auto;background:#efeaff;color:#6d55bf;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}
    main{padding:20px 18px}.hero{background:linear-gradient(135deg,#6e76d9,#8878c9);border-radius:23px;color:white;padding:22px;box-shadow:0 9px 24px #7476cf33}.hero .day{font-size:13px;opacity:.86}.hero h2{font-size:27px;margin:6px 0 17px;line-height:1.25}.hero-stats{display:flex;gap:20px}.hero-stats strong{font-size:22px;display:block}.hero-stats span{font-size:11px;opacity:.84}.hero small{font-size:11px;opacity:.8;display:block;margin-top:12px}
    .datebar{display:flex;gap:8px;margin:20px 0 13px}.datebar button,.seg button{border:1px solid #e7e6ef;background:white;color:#596174;border-radius:13px;padding:10px 15px;font-size:14px;font-weight:700}.datebar button.active,.seg button.active{background:#363d64;color:#fff;border-color:#363d64}.datebar input{width:42px;opacity:0;position:absolute;pointer-events:none}.datebar .datepick{margin-left:auto}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}.section-head h3{font-size:18px;margin:0}.section-head span{font-size:12px;color:#8b90a0}
    .meal{background:#fff;border:1px solid #eeedf5;border-radius:18px;padding:15px 16px;margin-bottom:10px;box-shadow:0 3px 10px #34334d08}.meal-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.meal-time{font-size:12px;color:#868da1;margin-bottom:5px}.meal-title{font-size:15px;font-weight:750;line-height:1.4}.meal-grams{font-size:12px;color:#7e8597;margin-top:5px}.status{border-radius:999px;padding:6px 8px;font-size:11px;font-weight:700;white-space:nowrap;background:#e5f6ef;color:#198063}.status.pending{background:#fff1db;color:#a4701a}.meal-actions{display:flex;gap:14px;margin-top:8px}.meal .meal-actions button{border:0;background:none;color:#6d5fc5;font-size:12px;font-weight:750;padding:2px 0}.meal .meal-actions button.delete{color:#b35362}.empty{padding:24px;text-align:center;color:#8a90a1;background:white;border-radius:18px}
    .day-summary{background:white;border:1px solid #ecebf4;border-radius:16px;padding:12px 14px;margin:9px 0;box-shadow:0 3px 10px #34334d08}.day-summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.day-summary h3{font-size:15px;margin:0}.day-summary .date-label{font-size:11px;color:#858b9d}.day-kcal{background:#f0edff;border-radius:12px;padding:9px 11px;margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.day-kcal strong{font-size:18px;color:#4c438f;white-space:nowrap}.day-kcal span{font-size:11px;color:#716aaf}.calorie-source{font-size:10px;color:#68708a;margin:6px 2px 0}.day-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}.day-stat{background:#f7f7fb;border-radius:10px;padding:8px 10px}.day-stat strong{display:block;font-size:15px;color:#343d61}.day-stat span{font-size:10px;color:#80879a}.day-meals{border:0;background:none;color:#685cc0;font-size:12px;font-weight:750;padding:9px 0 0}.history-meals{padding-top:4px}.history-note{font-size:10px;color:#858b9d;line-height:1.4;margin:4px 2px 10px}
    .hint{margin:14px 2px;color:#8b91a0;font-size:12px;line-height:1.5}.primary{background:#6e62cf;color:#fff;border:0;border-radius:15px;padding:15px 19px;font-weight:800;box-shadow:0 8px 18px #6e62cf33}.primary:disabled{background:#c8c8d8;box-shadow:none}.wide{width:100%}
    .open-list{display:grid;gap:9px;margin:0 0 15px}.open-pack{border:1px solid #ddd8f5;background:#fff;text-align:left;border-radius:15px;padding:13px 15px;width:100%}.open-pack strong{display:block;font-size:13px;line-height:1.35;color:#323651}.open-pack small{display:block;margin-top:5px;color:#716aaf}.open-pack .pack-badge{float:right;background:#f0ebff;color:#6658be;border-radius:999px;padding:4px 8px;font-size:11px}.subaction{border:0;background:none;color:#685bc2;font-size:12px;font-weight:750;padding:3px 0 13px}.details{border-top:1px solid #e8e7f0;padding-top:14px;margin-top:4px}.details summary{color:#697087;font-size:13px;font-weight:750;cursor:pointer;margin-bottom:14px}.detail-note{font-size:11px;color:#858b9d;line-height:1.45;margin:-7px 0 13px}
    .group-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.group-tabs button{flex:none;border:1px solid #e5e3ef;background:#fff;color:#596174;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:750}.group-tabs button.active{background:#363d64;color:#fff;border-color:#363d64}.group-help{font-size:11px;color:#858b9d;margin:0 0 8px;line-height:1.45}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);background:#fff;border-top:1px solid #e7e7f0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;z-index:10}.bottom .primary{flex:1}.nav{display:flex;gap:14px}.nav button{border:0;background:none;color:#8c91a3;font-size:11px;padding:4px 2px;display:grid;justify-items:center;gap:2px}.nav button.active{color:#6559bf;font-weight:800}.nav b{font-size:19px;line-height:1}
    .overlay{position:fixed;inset:0;background:#11182788;z-index:30;display:none;align-items:end;justify-content:center}.overlay.open{display:flex}.panel{width:min(100%,430px);height:min(100dvh,840px);background:#f8f8fc;border-radius:23px 23px 0 0;display:flex;flex-direction:column;overflow:hidden}.panel-header{background:#fff;padding:19px 20px 16px;border-bottom:1px solid #e9e9f2;display:flex;align-items:center;gap:12px}.panel-header h2{font-size:19px;margin:0;flex:1}.iconbtn{border:0;background:#f0eff7;border-radius:10px;width:35px;height:35px;font-size:18px}.panel-body{padding:18px 18px 28px;overflow:auto;flex:1}.label{display:block;font-size:13px;font-weight:750;color:#444d67;margin:0 0 8px}.seg{display:flex;gap:7px;align-items:center;margin:0 0 20px}.seg button{padding:10px 13px}.seg input{border:1px solid #ddddea;border-radius:10px;padding:9px;min-width:0;max-width:135px;background:white}.field{margin-bottom:18px}.field input{width:100%;padding:13px;border:1px solid #dcdce9;border-radius:12px;background:white}.helper{font-size:12px;color:#858b9d;margin:6px 0 0}.food-card{background:#fff;border:1px solid #e7e7f2;border-radius:17px;padding:14px;margin-bottom:10px}.food-card-head{display:flex;gap:10px;align-items:start}.food-card-head div{flex:1}.food-card strong{font-size:14px}.food-card small{font-size:11px;color:#858b9d;display:block;margin-top:5px}.food-card .row{display:flex;align-items:center;gap:10px;margin-top:12px}.food-card input{width:95px;padding:10px;border:1px solid #dcdce9;border-radius:11px}.food-card .remove{border:0;background:none;color:#ad5c63;font-size:12px}.addfood{border:1.5px dashed #a9a1db;background:#f5f2ff;color:#6657bf;border-radius:14px;width:100%;padding:14px;font-weight:800;margin-bottom:18px}.panel-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e9e9f2}.save-summary{display:flex;justify-content:space-between;font-size:12px;color:#787f94;margin-bottom:10px}.chooser-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chooser-tabs button{flex:none;border:1px solid #e5e3ef;background:#fff;color:#596174;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:750}.chooser-tabs button.active{background:#363d64;color:#fff;border-color:#363d64}.brand-picker{appearance:none;-webkit-appearance:none;width:100%;border:1px solid #d9d6e8;border-radius:14px;padding:13px 44px 13px 14px;background-color:#fff;margin:8px 0 4px;color:#353a53;font-weight:650;box-shadow:0 3px 10px #34334d0a;background-image:linear-gradient(45deg,transparent 50%,#7168b2 50%),linear-gradient(135deg,#7168b2 50%,transparent 50%),linear-gradient(to right,#ebe8f3,#ebe8f3);background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%,calc(100% - 38px) 50%;background-size:6px 6px,6px 6px,1px 22px;background-repeat:no-repeat;transition:border-color .15s,box-shadow .15s}.brand-picker:focus{outline:none;border-color:#8d81d2;box-shadow:0 0 0 3px #8d81d222,0 4px 12px #34334d0e}.brand-picker option{color:#353a53;background:#fff}.optional-search{border:0;background:none;color:#685cc0;font-size:12px;font-weight:750;padding:12px 2px}.searchbox{position:relative}.searchbox[hidden]{display:none}.searchbox input{width:100%;border:1px solid #dfdeea;border-radius:14px;padding:13px 15px 13px 42px;background:white}.searchbox span{position:absolute;left:15px;top:12px}.food-result{background:#fff;border:1px solid #ecebf3;padding:13px 15px;border-radius:13px;width:100%;text-align:left;margin-top:8px}.food-result strong{display:block;font-size:14px;color:#30384f}.food-result small{display:block;color:#858b9d;margin-top:4px}.result-head{font-size:12px;color:#777e92;font-weight:700;margin:20px 2px 8px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#30395b;color:white;border-radius:12px;padding:11px 15px;font-size:13px;z-index:50;display:none;width:max-content;max-width:90vw}.toast.show{display:block}.other{padding:22px 2px}.other h2{margin:0 0 10px}.other p{color:#777f93;line-height:1.6}.other-card{background:white;border:1px solid #eeeef6;padding:17px;border-radius:16px;margin:11px 0}.other-card strong{display:block;margin-bottom:5px}.muted{color:#8990a0;font-size:12px}
    @media(max-width:450px){.app{box-shadow:none}.panel{height:100dvh;border-radius:0}.overlay{align-items:stretch}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><img class="avatar" src="cover.jpg" alt="貓貓"><div><div class="eyebrow">每日飲食</div><h1 class="title">貓貓的紀錄</h1></div><span class="preview-badge">操作預覽</span></header>
  <main id="main"></main>
  <footer class="bottom"><nav class="nav" aria-label="主選單"><button data-page="home" class="active"><b>⌂</b>今天</button><button data-page="history"><b>▤</b>歷史</button><button data-page="more"><b>⋯</b>其他</button></nav><button class="primary" id="newMeal">＋ 記一餐</button></footer>
</div>
<div class="overlay" id="editor"><div class="panel"><header class="panel-header"><button class="iconbtn" id="closeEditor" aria-label="關閉">×</button><h2>記一餐</h2><span class="preview-badge">預覽</span></header><div class="panel-body"><label class="label">這餐是哪一天？</label><div class="seg" id="editorDates"></div><label class="label">開封中的食物 · 點一下加入</label><div class="open-list" id="openPackages"></div><button class="subaction" id="openNewPackage">＋ 開新包（可選）</button><label class="label">這餐盛出了多少？</label><div id="selectedFoods"></div><button class="addfood" id="chooseFood">＋ 加一種食物</button><details class="details"><summary>餵食時間與碗內剩餘（有剩再填）</summary><div class="field"><label class="label" for="mealTime">餵食時間</label><input id="mealTime" type="time"><p class="helper">不確定時間時留空，不會把記錄時間當作餵食時間。</p></div><div class="field"><label class="label" for="remaining">碗內剩餘重量</label><input id="remaining" type="number" min="0" step="0.1" placeholder="有剩才填克數"><p class="helper">留空就當 0g、表示這餐吃完；這裡不是包內剩餘。</p></div></details></div><div class="panel-foot"><div class="save-summary"><span id="mealSummary">0 種食物 · 0 g</span><strong id="dateSummary"></strong></div><button class="primary wide" id="saveMeal" disabled>儲存這餐</button></div></div></div>
<div class="overlay" id="search"><div class="panel"><header class="panel-header"><button class="iconbtn" id="closeSearch" aria-label="返回">‹</button><h2 id="chooserTitle">選食物</h2></header><div class="panel-body"><div class="chooser-tabs" id="chooserTabs"></div><div id="brandArea"></div><div class="result-head" id="resultLabel">最近選過的食物 · 點一下加入</div><div id="foodResults"></div><button class="optional-search" id="toggleSearch">找不到食物？用文字找</button><div class="searchbox" id="searchBox" hidden><span>⌕</span><input id="query" type="search" placeholder="搜尋品名、品牌或肉類" autocomplete="off"></div><p class="helper" id="sourceInfo">載入食物資料中…</p></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
  const today = new Date();
  const dayKey = offset => { const d = new Date(today.getFullYear(),today.getMonth(),today.getDate()+offset); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const shortDate = date => `${Number(date.slice(5,7))}/${Number(date.slice(8,10))}`;
  const state = {date:dayKey(0), page:'home', foods:[], packages:[], meals:[{date:dayKey(0),time:'14:20',foods:[{name:'主食罐・雞肉',category:'主食罐',grams:35,calories:105}],remaining:0},{date:dayKey(0),time:'09:10',foods:[{name:'鮭魚餐包',category:'主食餐包',grams:40,calories:92}],remaining:0},{date:dayKey(-1),time:'20:30',foods:[{name:'乾糧・雞肉',category:'乾糧',grams:30,calories:380}],remaining:5}]};
  let database=[];
  let expandedHistoryDate='';
  let chooserMode='recent',selectedBrand='',selectedSeries='',selectedGroup='',recentIndices=[],openingPackage=false,visibleResults=30;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const proteinGroups={mammal:new Set('兔肉 牛肉 羊肉 袋鼠 豬肉 鹿肉'.split(' ')),bird:new Set('火雞 火雞肉 烏骨雞 雞肉 鴕鳥 鴨肉 鴿 鵝肉 鵪鶉'.split(' ')),fish:new Set('司目魚 土魠魚 旗魚 柳葉魚 柴魚 比目魚 沙丁魚 海魚 烏魚 白帶魚 白魚 石斑 竹莢魚 紅魽 虱目魚 鬼頭刀 魩仔魚 鮪魚 鮭魚 鯖魚 鯛魚 鯡魚 鰤魚 鰹魚 鰻魚 鱈魚 鱸魚 龍虎石斑'.split(' ')),seafood:new Set('海瓜子 海膽 花枝 蝦 蟹 貝'.split(' '))};
  const groupLabels={mammal:'獸肉',bird:'禽肉',fish:'魚類',seafood:'其他海鮮',other:'其他'};
  const meatGroup=meat=>Object.entries(proteinGroups).find(([,names])=>names.has(meat))?.[0]||'other';
  const foodInGroup=(food,group)=>!group||food.meat.split(',').map(m=>meatGroup(m.trim())).includes(group);
  function rawSeries(food){const tail=food.name.startsWith(food.brand)?food.name.slice(food.brand.length).trim():food.name;if(tail.startsWith('TUTU'))return 'TUTU';return tail.split(/[\s-]/,1)[0]||'其他款'}
  function seriesBuckets(foods){const counts=new Map();foods.forEach(f=>counts.set(rawSeries(f),(counts.get(rawSeries(f))||0)+1));return foods.map(f=>counts.get(rawSeries(f))>=2?rawSeries(f):'其他款')}
  function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
  async function loadFoods(){try{const r=await fetch('CatFoodInfo.csv');if(!r.ok)throw Error();database=parseCsv(await r.text()).slice(1).filter(r=>r[0]&&Number.isFinite(Number(r[2]))).map(r=>({name:r[0],category:r[1],calories:Number(r[2]),brand:r[3].trim().toLowerCase()==='catdives 貓爾地夫'?'Catdives 貓爾地夫':r[3],meat:r[4]}));$('sourceInfo').textContent=`預覽使用本機 CSV：${database.length} 筆食物`;}catch{database=[{name:'雞肉主食罐',category:'主食罐',calories:105,brand:'示範',meat:'雞肉'},{name:'鮭魚餐包',category:'主食餐包',calories:92,brand:'示範',meat:'鮭魚'}];$('sourceInfo').textContent='目前使用示範食物';}try{const r=await fetch('package-capacities.json');if(r.ok){const rules=await r.json();database.forEach(f=>{const rule=rules.find(x=>(!x.brand||x.brand===f.brand)&&x.category===f.category&&(!x.nameStartsWith||f.name.startsWith(x.nameStartsWith)));if(rule)f.packageGrams=rule.grams})}}catch(e){console.warn('無法載入包裝容量',e)}recentIndices=['Hoorooroo','Catdives','Abao','Instinct','K9 Natural'].map(word=>database.findIndex(f=>f.name.includes(word))).filter(i=>i>=0);if(!recentIndices.length)recentIndices=database.map((_,i)=>i).slice(0,6);const sample=['Push! 噗滋包','Catssay 貓有話說 鮮滴精乳鐵-'];sample.forEach((prefix,i)=>{const foodIndex=database.findIndex(f=>f.name.startsWith(prefix));if(foodIndex>=0){const food=database[foodIndex];state.packages.push({id:`sample-${i}`,foodIndex,initialGrams:food.packageGrams||80,remainingGrams:(food.packageGrams||80)-(i?18:25)})}});renderChooser()}
  function mealCalories(m){const total=m.foods.reduce((a,f)=>a+f.grams*f.calories/100,0),grams=m.foods.reduce((a,f)=>a+f.grams,0);return m.remaining===null?null:Math.round(total*(grams-m.remaining)/grams)}
  function dailyNutrition(meals){const result={grams:{dry:0,wet:0,other:0},kcal:{dry:0,wet:0,other:0},pending:false};for(const meal of meals){if(meal.remaining===null){result.pending=true;continue}const total=meal.foods.reduce((sum,food)=>sum+Number(food.grams||0),0);if(!total)continue;const eaten=Math.max(0,total-Number(meal.remaining||0));for(const food of meal.foods){const share=eaten*Number(food.grams||0)/total;const type=food.category==='乾糧'?'dry':['主食罐','主食餐包','副食罐'].includes(food.category)?'wet':'other';result.grams[type]+=share;result.kcal[type]+=share*Number(food.calories||0)/100}}result.totalKcal=Math.round(Object.values(result.kcal).reduce((sum,kcal)=>sum+kcal,0));result.mainSource=Object.entries(result.kcal).filter(([type])=>type!=='other').sort((a,b)=>b[1]-a[1])[0];return result}
  function dateButtons(){return `<div class="datebar"><button data-day="${dayKey(0)}" class="${state.date===dayKey(0)?'active':''}">今天</button><button data-day="${dayKey(-1)}" class="${state.date===dayKey(-1)?'active':''}">昨天</button><button class="datepick" id="pickDate">${state.date===dayKey(0)||state.date===dayKey(-1)?'選日期':esc(shortDate(state.date))} ▾</button><input id="homeDate" type="date" value="${esc(state.date)}"></div>`}
  function mealCard(m){const grams=m.foods.reduce((a,f)=>a+f.grams,0),i=state.meals.indexOf(m);return `<article class="meal"><div class="meal-top"><div><div class="meal-time">${m.time||'未指定時間'}</div><div class="meal-title">${m.foods.map(f=>esc(f.name)).join('＋')}</div><div class="meal-grams">餵食 ${grams} g · ${m.foods.length} 種食物</div></div><span class="status ${m.remaining===null?'pending':''}">${m.remaining===null?'待補攝取量':`${mealCalories(m)} kcal`}</span></div><div class="meal-actions"><button type="button" data-edit="${i}">編輯</button><button type="button" class="delete" data-delete="${i}">刪除</button></div></article>`}
  function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='home'){const list=state.meals.filter(m=>m.date===state.date),known=list.map(mealCalories).filter(v=>v!==null).reduce((a,b)=>a+b,0);$('main').innerHTML=`<section class="hero"><div class="day">${state.date===dayKey(0)?'今天':state.date===dayKey(-1)?'昨天':'所選日期'}・${esc(shortDate(state.date))}</div><h2>${list.length?'記下每一餐，剛剛好。':'從這一餐開始記錄。'}</h2><div class="hero-stats"><div><strong>${list.length}</strong><span>已記錄餐點</span></div><div><strong>${known}</strong><span>已確認攝取 kcal</span></div></div><small>${list.some(m=>m.remaining===null)?'有餐點尚未補攝取量':'當日餐點已整理完成'}</small></section>${dateButtons()}<div class="section-head"><h3>${state.date===dayKey(0)?'今天的餐點':state.date===dayKey(-1)?'昨天的餐點':'當天的餐點'}</h3><span>最新紀錄在前</span></div>${list.length?list.map(mealCard).join(''):'<div class="empty">這一天還沒有餐點</div>'}<p class="hint">這是操作預覽。試記的餐點只留在此頁，重新整理後會重設。</p>`;}else if(state.page==='history'){const dates=[...new Set(state.meals.map(m=>m.date))].sort().reverse();$('main').innerHTML=`<section class="other"><h2>歷史紀錄</h2><p>每日摘要只顯示總熱量與乾、濕食重量；點開日期查看各餐明細。</p>${dates.map(d=>{const meals=state.meals.filter(m=>m.date===d),summary=dailyNutrition(meals),pending=summary.pending,isExpanded=expandedHistoryDate===d,source=summary.mainSource&&summary.mainSource[1]>0?(summary.mainSource[0]==='dry'?'乾糧':'濕食'):'尚無主要熱量來源';return `<article class="day-summary"><div class="day-summary-head"><div><h3>${esc(d===dayKey(0)?'今天':d===dayKey(-1)?'昨天':shortDate(d))}</h3><span class="date-label">${esc(d)}${pending?' · 有餐點待補攝取量':''}</span></div></div><div class="day-kcal"><span>${pending?'已確認熱量（部分待補）':'每日總熱量'}</span><strong>${summary.totalKcal} kcal</strong></div><div class="calorie-source">主要熱量來源：${source}</div><div class="day-stats"><div class="day-stat"><strong>${summary.grams.wet.toFixed(1)} g</strong><span>濕食攝取</span></div><div class="day-stat"><strong>${summary.grams.dry.toFixed(1)} g</strong><span>乾糧攝取</span></div></div><button class="day-meals" data-history-date="${esc(d)}">${isExpanded?'收起餐點明細':'查看 '+meals.length+' 餐明細'}　${isExpanded?'⌃':'⌄'}</button>${isExpanded?`<div class="history-meals">${meals.map(mealCard).join('')}</div>`:''}</article>`}).join('')||'<div class="empty">目前沒有歷史紀錄</div>'}<p class="history-note">混合餐點只記錄整碗剩餘時，乾糧／濕食重量與各自熱量按盛出比例估算。待補攝取量餐點不計入已確認數字。</p></section>`}else{$('main').innerHTML='<section class="other"><h2>其他功能</h2><p>把低頻使用的功能從每日記餐路徑移開。</p><div class="other-card"><strong>趨勢與體重</strong><span class="muted">查看熱量變化、記錄體重</span></div><div class="other-card"><strong>資料與同步</strong><span class="muted">查看本機／雲端狀態、匯出備份</span></div><div class="other-card"><strong>食物資料</strong><span class="muted">查看來源與更新時間</span></div></section>'}}
  function renderEditorDates(){const dates=$('editorDates');dates.innerHTML=`<button data-edate="${dayKey(0)}" class="${state.date===dayKey(0)?'active':''}">今天</button><button data-edate="${dayKey(-1)}" class="${state.date===dayKey(-1)?'active':''}">昨天</button><input id="editorDate" type="date" value="${esc(state.date)}" aria-label="選擇其他日期">`;$('dateSummary').textContent=`儲存到 ${state.date}`}
  function updateMealSummary(){const grams=state.foods.reduce((a,f)=>a+(Number(f.grams)||0),0),calories=state.foods.reduce((a,f)=>a+(Number(f.grams)||0)*f.calories/100,0);$('mealSummary').textContent=`${state.foods.length} 種 · ${grams.toFixed(1)} g · 盛出約 ${Math.round(calories)} kcal`;$('saveMeal').disabled=!state.foods.length||state.foods.some(f=>!(Number(f.grams)>0));$('dateSummary').textContent=`儲存到 ${state.date}`}
  function renderOpenPackages(){const box=$('openPackages');box.innerHTML=state.packages.filter(p=>p.remainingGrams>0).map(p=>{const food=database[p.foodIndex];return `<button class="open-pack" data-pack="${esc(p.id)}"><span class="pack-badge">包內約剩 ${p.remainingGrams.toFixed(1)}g</span><strong>${esc(food.name)}</strong><small>每包 ${p.initialGrams}g · 這餐可直接選</small></button>`}).join('')||'<div class="empty">還沒有開封中的食物，可直接選食物或開一包。</div>'}
  function renderSelected(){const box=$('selectedFoods');box.innerHTML=state.foods.map((f,i)=>`<div class="food-card"><div class="food-card-head"><div><strong>${esc(f.name)}</strong><small>${esc(f.category)} · ${f.calories} kcal/100g${f.packageGrams?` · 每包 ${f.packageGrams}g`:''}</small></div><button class="remove" data-remove="${i}">移除</button></div><div class="row"><input aria-label="${esc(f.name)} 重量" data-grams="${i}" type="number" min="0" step="0.1" value="${f.grams||''}" placeholder="這餐盛出"><span class="muted">克</span></div></div>`).join('');updateMealSummary()}
  function openEditor(editIndex=null){state.editIndex=editIndex;state.foods=editIndex===null?[]:state.meals[editIndex].foods.map(f=>({...f}));$('remaining').value=editIndex===null?'':(state.meals[editIndex].remaining||'');$('mealTime').value=editIndex===null?'':state.meals[editIndex].time||'';if(editIndex!==null)state.date=state.meals[editIndex].date;$('saveMeal').textContent=editIndex===null?'儲存這餐':'更新餐點';renderEditorDates();renderOpenPackages();renderSelected();$('editor').classList.add('open')}
  function closeEditor(){$('editor').classList.remove('open');render()}
  function renderChooser(){const categories=['recent','主食罐','主食餐包','乾糧','副食罐','奶粉'];$('chooserTabs').innerHTML=categories.map(c=>`<button data-category="${esc(c)}" class="${chooserMode===c?'active':''}">${c==='recent'?'最近用過':c}</button>`).join('');const categoryFoods=database.filter(f=>f.category===chooserMode),brands=[...new Set(categoryFoods.map(f=>f.brand))].sort((a,b)=>a.localeCompare(b,'zh-Hant')),brandFoods=categoryFoods.filter(f=>!selectedBrand||f.brand===selectedBrand),series=seriesBuckets(brandFoods),seriesChoices=[...new Set(series)].sort((a,b)=>a.localeCompare(b,'zh-Hant')),seriesFoods=brandFoods.filter((_,i)=>!selectedSeries||series[i]===selectedSeries),groups=Object.keys(groupLabels);$('brandArea').innerHTML=chooserMode==='recent'?'':`<label class="label" for="brandPicker">品牌（可選）</label><select class="brand-picker" id="brandPicker"><option value="">所有品牌</option>${brands.map(b=>`<option value="${esc(b)}" ${selectedBrand===b?'selected':''}>${esc(b)}</option>`).join('')}</select>${selectedBrand&&seriesChoices.length>1?`<label class="label">系列（可選）</label><div class="group-tabs" aria-label="商品系列"><button data-series="" class="${selectedSeries===''?'active':''}">全部 ${brandFoods.length}</button>${seriesChoices.map(s=>`<button data-series="${esc(s)}" class="${selectedSeries===s?'active':''}">${esc(s)} ${series.filter(x=>x===s).length}</button>`).join('')}</div>`:''}<label class="label">食材類型（可選）</label><div class="group-tabs" aria-label="食材類型"><button data-group="" class="${selectedGroup===''?'active':''}">全部 ${seriesFoods.length}</button>${groups.map(g=>{const count=seriesFoods.filter(f=>foodInGroup(f,g)).length;return count?`<button data-group="${g}" class="${selectedGroup===g?'active':''}">${groupLabels[g]} ${count}</button>`:''}).join('')}</div><p class="group-help">先選品牌和系列更容易找；混合口味可再用食材類型縮小清單。</p>`;renderResults()}
  function renderResults(){const q=$('searchBox').hidden?'':$('query').value.trim().toLowerCase();let matches,label;if(q){matches=database.filter(f=>`${f.name} ${f.brand} ${f.meat}`.toLowerCase().includes(q));label='文字查找結果';}else if(chooserMode==='recent'){matches=recentIndices.map(i=>database[i]).filter(Boolean);label='最近選過的食物';}else{const brandFoods=database.filter(f=>f.category===chooserMode&&(!selectedBrand||f.brand===selectedBrand)),series=seriesBuckets(brandFoods);matches=brandFoods.filter((f,i)=>(!selectedSeries||series[i]===selectedSeries)&&foodInGroup(f,selectedGroup));label=[chooserMode,selectedBrand,selectedSeries,groupLabels[selectedGroup]].filter(Boolean).join(' · ')}const shown=matches.slice(0,visibleResults);$('resultLabel').textContent=`${label} · 顯示 ${shown.length}/${matches.length} 款`;$('foodResults').innerHTML=shown.length?shown.map(f=>`<button class="food-result" data-food="${database.indexOf(f)}"><strong>${esc(f.name)}</strong><small>${esc(f.brand)} · ${esc(f.category)} · ${f.calories} kcal/100g${f.packageGrams?` · 每包 ${f.packageGrams}g`:''}</small></button>`).join('')+(shown.length<matches.length?`<button class="addfood" id="showMoreFoods">顯示更多（還有 ${matches.length-shown.length} 款）</button>`:''):'<div class="empty">這個篩選沒有商品，請選其他系列或食材類型。</div>'}
  function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
  function openChooser(asPackage){openingPackage=asPackage;visibleResults=30;$('chooserTitle').textContent=asPackage?'開新包 · 選食物':'選食物';$('search').classList.add('open');chooserMode='recent';selectedBrand='';selectedSeries='';selectedGroup='';$('searchBox').hidden=true;$('query').value='';$('toggleSearch').textContent='找不到食物？用文字找';renderChooser()}
  $('newMeal').onclick=()=>openEditor();$('closeEditor').onclick=closeEditor;$('chooseFood').onclick=()=>openChooser(false);$('openNewPackage').onclick=()=>openChooser(true);$('closeSearch').onclick=()=>$('search').classList.remove('open');$('query').oninput=()=>{visibleResults=30;renderResults()};$('toggleSearch').onclick=()=>{$('searchBox').hidden=!$('searchBox').hidden;$('toggleSearch').textContent=$('searchBox').hidden?'找不到食物？用文字找':'收起文字查找';$('query').value='';visibleResults=30;renderResults();if(!$('searchBox').hidden)$('query').focus()};
  $('saveMeal').onclick=()=>{const grams=state.foods.reduce((a,f)=>a+Number(f.grams),0),r=$('remaining').value.trim();if(r!==''&&(Number(r)<0||Number(r)>grams)){toast(`碗內剩餘需在 0～${grams} 克之間`);return}const meal={date:state.date,time:$('mealTime').value,foods:state.foods.map(f=>({...f,grams:Number(f.grams)})),remaining:r===''?0:Number(r)};if(state.editIndex!==null){state.meals[state.editIndex].foods.forEach(f=>{const p=state.packages.find(p=>p.id===f.packageId);if(p)p.remainingGrams+=Number(f.grams)})}meal.foods.forEach(f=>{const p=state.packages.find(p=>p.id===f.packageId);if(p)p.remainingGrams-=f.grams});if(state.editIndex===null)state.meals.unshift(meal);else state.meals[state.editIndex]=meal;state.page='home';closeEditor();toast(state.editIndex===null?'已加入當天餐點，可繼續記下一餐':'餐點已更新')};
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render()}if(b.dataset.historyDate!==undefined){expandedHistoryDate=expandedHistoryDate===b.dataset.historyDate?'':b.dataset.historyDate;render()}if(b.dataset.day){state.date=b.dataset.day;render()}if(b.id==='pickDate')$('homeDate').showPicker?.();if(b.dataset.edate){state.date=b.dataset.edate;renderEditorDates()}if(b.dataset.edit!==undefined)openEditor(Number(b.dataset.edit));if(b.dataset.delete!==undefined){const index=Number(b.dataset.delete);if(confirm('確定要刪除這筆餐點嗎？此操作無法復原。')){state.meals.splice(index,1);render();toast('餐點已刪除')}}if(b.dataset.remove!==undefined){state.foods.splice(Number(b.dataset.remove),1);renderSelected()}if(b.dataset.pack!==undefined){const p=state.packages.find(p=>p.id===b.dataset.pack);if(p){state.foods.push({...database[p.foodIndex],packageId:p.id,grams:''});renderSelected();document.querySelector(`[data-grams="${state.foods.length-1}"]`)?.focus()}}if(b.dataset.category){chooserMode=b.dataset.category;if(selectedBrand&&!database.some(f=>f.category===chooserMode&&f.brand===selectedBrand))selectedBrand='';selectedSeries='';selectedGroup='';visibleResults=30;$('searchBox').hidden=true;$('query').value='';$('toggleSearch').textContent='找不到食物？用文字找';renderChooser()}if(b.dataset.series!==undefined){selectedSeries=b.dataset.series;selectedGroup='';visibleResults=30;renderChooser()}if(b.dataset.group!==undefined){selectedGroup=b.dataset.group;visibleResults=30;renderChooser()}if(b.id==='showMoreFoods'){visibleResults+=30;renderResults()}if(b.dataset.food!==undefined){const i=Number(b.dataset.food),f=database[i];recentIndices=[i,...recentIndices.filter(n=>n!==i)].slice(0,10);if(openingPackage){const grams=f.packageGrams||80;const p={id:`pack-${Date.now()}-${Math.random()}`,foodIndex:i,initialGrams:grams,remainingGrams:grams};state.packages.unshift(p);renderOpenPackages();toast(`已開一包 ${grams}g，點卡片加入這餐`)}else{state.foods.push({...f,grams:''});renderSelected()}$('search').classList.remove('open');if(!openingPackage)document.querySelector(`[data-grams="${state.foods.length-1}"]`)?.focus()}});
  document.addEventListener('input',e=>{if(e.target.dataset.grams!==undefined){state.foods[Number(e.target.dataset.grams)].grams=e.target.value;updateMealSummary()}if(e.target.id==='editorDate'){state.date=e.target.value;updateMealSummary()}});
  document.addEventListener('change',e=>{if(e.target.id==='homeDate'){state.date=e.target.value;render()}if(e.target.id==='brandPicker'){selectedBrand=e.target.value;selectedSeries='';selectedGroup='';visibleResults=30;renderChooser()}});
  render();loadFoods();
</script>
